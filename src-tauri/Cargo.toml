[package]
name = "posture-app"
version = "0.1.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "posture_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["direct-distribution"]
direct-distribution = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process", "tauri/macos-private-api"]
mac-app-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
base64 = "0.22"
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSNotification", "NSOperation", "NSProcessInfo", "block2", "NSArray", "NSURL", "NSString", "NSData", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSPanel", "NSView", "NSColor", "NSScreen", "NSGraphics", "NSGraphicsContext", "NSEvent", "NSWorkspace", "NSSharingService", "NSSavePanel", "NSApplication", "block2"] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
