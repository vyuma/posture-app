name: Web and analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  desktop:
    uses: ./.github/workflows/desktop-checks.yml
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:accounts
      - run: npm run test:server
      - run: bun test scripts/head-tilt-posture.test.ts scripts/landmark-loss.test.ts scripts/work-session.test.ts scripts/timelapse-pet-layout.test.ts scripts/widget-drag.test.ts
      - run: node --test scripts/download-mac.test.mjs
      - run: bun run build:web
  preview:
    needs: [checks, desktop]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PIIIN_D1_ID: ${{ vars.PIIIN_D1_ID }}
      PIIIN_WORKER_NAME: piiin-pr-${{ github.event.pull_request.number }}
      PIIIN_APP_ORIGIN: https://piiin-pr-${{ github.event.pull_request.number }}.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: node scripts/cloudflare-preflight.mjs preview
      - run: node node_modules/cf/bin/cf d1 migrations apply "$PIIIN_D1_ID" --dir server/migrations
      - run: bun run build:web --mode preview
      - run: node node_modules/cf/bin/cf deploy --prebuilt
      - name: Preview address
        run: printf '%s\n' "Preview ${PIIIN_APP_ORIGIN}" >> "$GITHUB_STEP_SUMMARY"
  production:
    needs: [checks, desktop]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PIIIN_D1_ID: ${{ vars.PIIIN_D1_ID }}
      PIIIN_APP_ORIGIN: https://www.piiin.app
      PIIIN_DOMAIN_ENABLED: ${{ vars.PIIIN_DOMAIN_ENABLED }}
      PIIIN_AUTH_ENABLED: ${{ vars.PIIIN_AUTH_ENABLED }}
      PIIIN_APPLE_ENABLED: ${{ vars.PIIIN_APPLE_ENABLED }}
      PIIIN_DEVELOPER_ENABLED: ${{ vars.PIIIN_DEVELOPER_ENABLED }}
      PIIIN_GOOGLE_PROFILE_ENABLED: ${{ vars.PIIIN_GOOGLE_PROFILE_ENABLED }}
      PIIIN_RESTORE_LOCK: ${{ vars.PIIIN_RESTORE_LOCK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: node scripts/cloudflare-preflight.mjs production
      - run: node node_modules/cf/bin/cf d1 migrations apply "$PIIIN_D1_ID" --dir server/migrations
      - run: bun run build:web
      - run: node node_modules/cf/bin/cf deploy --prebuilt
