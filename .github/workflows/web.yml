name: Web and analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deployment target (production only from main)
        type: choice
        default: checks
        options: [checks, staging, production]
permissions:
  contents: read
concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  desktop:
    uses: ./.github/workflows/desktop-checks.yml
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:accounts
      - run: npm run test:server
      - run: bun test scripts/head-tilt-posture.test.ts scripts/landmark-loss.test.ts scripts/work-session.test.ts scripts/timelapse-pet-layout.test.ts scripts/widget-drag.test.ts
      - run: node --test scripts/download-mac.test.mjs
      - run: node --test scripts/cloudflare-preflight.test.mjs
      - run: bun run build:web
      - run: node node_modules/cf/bin/cf deploy --prebuilt --mode production --dry-run
  preview:
    needs: [checks, desktop]
    # Enable only after the administrator finishes the deployment credentials.
    if: vars.PIIIN_CLOUDFLARE_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PIIIN_D1_ID: ${{ vars.PIIIN_D1_ID }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      PIIIN_WORKER_NAME: piiin-pr-${{ github.event.pull_request.number }}
      PIIIN_PRODUCTION_D1_ID: ${{ vars.PIIIN_PRODUCTION_D1_ID }}
      PIIIN_APP_ORIGIN: https://piiin-pr-${{ github.event.pull_request.number }}.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: node scripts/cloudflare-preflight.mjs preview
      - run: node node_modules/cf/bin/cf d1 migrations apply "$PIIIN_D1_ID" --dir server/migrations
      - run: bun run build:web --mode preview
      - run: node node_modules/cf/bin/cf deploy --prebuilt --mode preview
      - run: node scripts/check-web-deployment.mjs "$PIIIN_APP_ORIGIN"
      - name: Preview address
        run: printf '%s\n' "Preview ${PIIIN_APP_ORIGIN}" >> "$GITHUB_STEP_SUMMARY"
  staging:
    needs: [checks, desktop]
    if: vars.PIIIN_CLOUDFLARE_CI_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.deploy == 'staging'
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PIIIN_D1_ID: ${{ vars.PIIIN_D1_ID }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      PIIIN_WORKER_NAME: piiin-staging
      PIIIN_PRODUCTION_D1_ID: ${{ vars.PIIIN_PRODUCTION_D1_ID }}
      PIIIN_APP_ORIGIN: https://piiin-staging.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
      PIIIN_AUTH_ENABLED: ${{ vars.PIIIN_AUTH_ENABLED }}
      PIIIN_APPLE_ENABLED: ${{ vars.PIIIN_APPLE_ENABLED }}
      PIIIN_DEVELOPER_ENABLED: ${{ vars.PIIIN_DEVELOPER_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: node scripts/cloudflare-preflight.mjs staging
      - run: node node_modules/cf/bin/cf d1 migrations apply "$PIIIN_D1_ID" --dir server/migrations
      - run: bun run build:web --mode preview
      - run: node node_modules/cf/bin/cf deploy --prebuilt --mode preview
      - run: node scripts/check-web-deployment.mjs "$PIIIN_APP_ORIGIN"
      - name: Login verification address
        run: printf '%s\n' "Staging ${PIIIN_APP_ORIGIN}/app" >> "$GITHUB_STEP_SUMMARY"
  production:
    needs: [checks, desktop]
    if: vars.PIIIN_CLOUDFLARE_CI_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == 'production'))
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PIIIN_D1_ID: ${{ vars.PIIIN_D1_ID }}
      PIIIN_WORKER_NAME: piiin
      PIIIN_APP_ORIGIN: https://www.piiin.app
      PIIIN_DOMAIN_ENABLED: ${{ vars.PIIIN_DOMAIN_ENABLED }}
      PIIIN_AUTH_ENABLED: ${{ vars.PIIIN_AUTH_ENABLED }}
      PIIIN_APPLE_ENABLED: ${{ vars.PIIIN_APPLE_ENABLED }}
      PIIIN_DEVELOPER_ENABLED: ${{ vars.PIIIN_DEVELOPER_ENABLED }}
      PIIIN_GOOGLE_PROFILE_ENABLED: ${{ vars.PIIIN_GOOGLE_PROFILE_ENABLED }}
      PIIIN_RESTORE_LOCK: ${{ vars.PIIIN_RESTORE_LOCK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: node scripts/cloudflare-preflight.mjs production
      - run: node node_modules/cf/bin/cf d1 migrations apply "$PIIIN_D1_ID" --dir server/migrations
      - run: bun run build:web
      - run: node node_modules/cf/bin/cf deploy --prebuilt --mode production
      - if: vars.PIIIN_DOMAIN_ENABLED == 'true' && vars.PIIIN_RESTORE_LOCK != 'true'
        run: node scripts/check-web-deployment.mjs "$PIIIN_APP_ORIGIN"
