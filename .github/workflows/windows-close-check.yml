name: Windows close regression
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Windows Store package workflow run to test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  close:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: piiin-store-submission
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.package_run_id }}
          path: package-download
      - name: Test title-bar close with hidden and visible pet windows
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem package-download -Recurse -Filter *.msix)
          if ($packages.Count -ne 1) { throw 'Expected exactly one MSIX.' }
          $destination = Join-Path $env:RUNNER_TEMP 'close-smoke-package'
          [System.IO.Compression.ZipFile]::ExtractToDirectory($packages[0].FullName, $destination)
          ./scripts/test-windows-close.ps1 -Executable "$destination/posture-app.exe"
